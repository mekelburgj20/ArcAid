name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      # Doc-only commits don't need a Hetzner rebuild — these files aren't
      # served by the running app. paths-ignore only suppresses the workflow
      # when *every* changed file matches; mixed code+doc commits still
      # deploy. Use workflow_dispatch to force a deploy after a doc-only push.
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.claude/**'
      - 'releases/**'
  # PR test gate: run the full build+test suite on every PR targeting main so a
  # red build/suite blocks the merge, not just the post-merge deploy. The
  # build/deploy job is gated to push/dispatch below, so PRs run the gate only
  # — no image push, no Hetzner deploy, no secrets needed.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Test gate (S0; split into its own job as an S10 follow-up so it gates both
  # PRs and deploys). Compiles + tests BOTH halves so dependency bumps
  # (Dependabot) are validated end-to-end before merge:
  #   backend  — tsc build + vitest
  #   admin-ui — tsc -b + vite build + vitest
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Build backend (tsc)
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Install admin-ui deps
        working-directory: admin-ui
        run: npm ci

      - name: Build admin-ui (tsc + vite)
        working-directory: admin-ui
        run: npm run build

      - name: Run admin-ui tests
        working-directory: admin-ui
        run: npm test

  build-and-deploy:
    # Only build the image + deploy on a real push to main (or a manual
    # dispatch). PRs stop after `test`; `needs: test` makes a red gate block
    # the deploy.
    needs: test
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute build timestamp
        run: echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ env.BUILT_AT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/arcaid
            docker compose pull
            # --force-recreate: without it compose can keep the OLD container
            # running after pulling a new :latest (exactly the 2026-08-28
            # incident — the 08:33 v2.144.1 deploy reported success while prod
            # served the previous build all day). Same rule as the manual
            # deploy runbook.
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f

      # A deploy is not done until the LIVE app says it is running this
      # commit. /api/version reports the GIT_SHA baked into the image by the
      # build-args above, so a stale container (the pull/recreate silently
      # keeping the old build, as on 2026-08-28) turns this step — and the
      # whole run — red instead of reporting a green deploy that never
      # deployed. ~5 minutes covers the container's boot (DB migrations
      # included); the app normally answers within seconds of `up`.
      - name: Verify deployed version
        run: |
          echo "Expecting commit ${GITHUB_SHA} at https://arcaid.app/api/version"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 https://arcaid.app/api/version || true)
            if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "Verified: $body"
              exit 0
            fi
            echo "Attempt $i/30 — live version is: ${body:-unreachable}"
            sleep 10
          done
          echo "::error::Prod never reported commit ${GITHUB_SHA} — the deploy did NOT take effect."
          exit 1
