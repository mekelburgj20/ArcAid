name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      # Doc-only commits don't need a Hetzner rebuild — these files aren't
      # served by the running app. paths-ignore only suppresses the workflow
      # when *every* changed file matches; mixed code+doc commits still
      # deploy. Use workflow_dispatch to force a deploy after a doc-only push.
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.claude/**'
      - 'releases/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # S0 (Phase 0): test gate. Vitest must pass before we build/push/deploy.
      # Pre-S0 this workflow ran checkout -> build -> deploy with zero tests.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/arcaid
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
