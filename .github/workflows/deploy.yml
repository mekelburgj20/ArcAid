name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      # Doc-only commits don't need a Hetzner rebuild — these files aren't
      # served by the running app. paths-ignore only suppresses the workflow
      # when *every* changed file matches; mixed code+doc commits still
      # deploy. Use workflow_dispatch to force a deploy after a doc-only push.
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.claude/**'
      - 'releases/**'
  # PR test gate: run the full build+test suite on every PR targeting main so a
  # red build/suite blocks the merge, not just the post-merge deploy. The
  # build/deploy job is gated to push/dispatch below, so PRs run the gate only
  # — no image push, no Hetzner deploy, no secrets needed.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip the test job and go straight to build + deploy (hotfix; the Docker build still compiles both halves)'
        type: boolean
        default: false
      skip_snapshot:
        description: 'Deploy WITHOUT the pre-deploy database snapshot (only when the snapshot itself is what fails; there is then no file to roll a migration back to)'
        type: boolean
        default: false

# A newer push to the same PR cancels that PR's older test run (it tests code
# that is no longer the PR head). Pushes to main and manual runs each get their
# own group (the run id), so a deploy is never cancelled or queued by this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Test gate (S0; split into its own job as an S10 follow-up so it gates both
  # PRs and deploys). Compiles + tests BOTH halves so dependency bumps
  # (Dependabot) are validated end-to-end before merge:
  #   backend  — tsc build + vitest
  #   admin-ui — tsc -b + vite build + vitest
  #
  # SKIPPING THE GATE (owner ask, 2026-11-01): a push to main whose head commit
  # message contains `[skip tests]`, or a manual dispatch with skip_tests on,
  # skips this job and deploys straight away. Never honoured on a PR. The
  # Docker build below still compiles both halves, so a broken build cannot
  # ship — only the vitest suites and the WORK.md check are bypassed. This is
  # NOT `[skip ci]`, which suppresses the whole workflow, deploy included.
  test:
    if: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[skip tests]')) && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Build backend (tsc)
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: WORK.md is well-formed (the live tracker; grammar in .claude/commands/work.md)
        run: npm run work:check

      - name: CLAUDE.md and .claude/rules stay inside the agent-context budget
        run: npm run docs:check

      - name: Install admin-ui deps
        working-directory: admin-ui
        run: npm ci

      - name: Build admin-ui (tsc + vite)
        working-directory: admin-ui
        run: npm run build

      - name: Run admin-ui tests
        working-directory: admin-ui
        run: npm test

  build-and-deploy:
    # Only build the image + deploy on a real push to main (or a manual
    # dispatch). PRs stop after `test`; `needs: test` makes a red gate block
    # the deploy. A SKIPPED test job (the [skip tests] flag above) must not
    # skip this one too — the default for a dependent of a skipped job — so
    # the condition names the two results it accepts instead of relying on
    # the implicit success() check.
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute build timestamp
        run: echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ env.BUILT_AT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # X1 (docs/infrastructure-improvement-plan.md §3.2): the snapshot script
      # travels with the deploy as text, so it runs inside whatever image is
      # LIVE (the one about to be replaced) and needs no file there.
      - name: Encode the pre-deploy snapshot script
        run: echo "SNAPSHOT_JS_B64=$(base64 -w0 tools/pre-deploy-snapshot.cjs)" >> "$GITHUB_ENV"

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          SNAPSHOT_JS_B64: ${{ env.SNAPSHOT_JS_B64 }}
          SKIP_SNAPSHOT: ${{ inputs.skip_snapshot || false }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: SNAPSHOT_JS_B64,SKIP_SNAPSHOT
          script: |
            # Stop at the first failure (POSIX flags only: the login shell
            # may be sh). Before X1 a failed pull still ran `up`.
            set -eu
            cd /opt/arcaid
            docker compose pull
            # X1 — a copy of the database from just BEFORE the new container
            # boots and runs its migrations (forward-only: this file is the
            # only way back from a bad one; docs/runbooks/rollback.md). Taken
            # from the running container with VACUUM INTO, as the app's own
            # user, into data/pre-deploy/ (newest 20 kept). If it fails the
            # deploy stops HERE, with prod still on the old build. A container
            # that is not running has nothing writing to copy from, so a
            # deploy that repairs a dead prod is not blocked.
            if [ "${SKIP_SNAPSHOT:-false}" = "true" ]; then
              echo "pre-deploy snapshot SKIPPED (skip_snapshot input)"
            elif [ "$(docker inspect -f '{{.State.Status}}' arcaid 2>/dev/null || true)" = "running" ]; then
              SNAP_JS="$(mktemp)"
              echo "$SNAPSHOT_JS_B64" | base64 -d > "$SNAP_JS"
              docker exec -i -u arcaid -w /app arcaid node - < "$SNAP_JS"
              rm -f "$SNAP_JS"
            else
              echo "arcaid is not running: no pre-deploy snapshot taken"
            fi
            # --force-recreate: without it compose can keep the OLD container
            # running after pulling a new :latest (exactly the 2026-08-28
            # incident — the 08:33 v2.144.1 deploy reported success while prod
            # served the previous build all day). Same rule as the manual
            # deploy runbook.
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f

      # A deploy is not done until the LIVE app says it is running this
      # commit. /api/version reports the GIT_SHA baked into the image by the
      # build-args above, so a stale container (the pull/recreate silently
      # keeping the old build, as on 2026-08-28) turns this step — and the
      # whole run — red instead of reporting a green deploy that never
      # deployed. ~5 minutes covers the container's boot (DB migrations
      # included); the app normally answers within seconds of `up`.
      - name: Verify deployed version
        run: |
          echo "Expecting commit ${GITHUB_SHA} at https://arcaid.app/api/version"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 https://arcaid.app/api/version || true)
            if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              echo "Verified: $body"
              exit 0
            fi
            echo "Attempt $i/30 — live version is: ${body:-unreachable}"
            sleep 10
          done
          echo "::error::Prod never reported commit ${GITHUB_SHA} — the deploy did NOT take effect."
          exit 1
