version: '3.8'

services:
  arcaid:
    build: .
    # Reconciled with production: the running container is "arcaid" (was "arcaid-bot").
    container_name: arcaid
    restart: unless-stopped
    # Run an init process (tini) as PID 1 so orphaned Playwright/Chromium
    # grandchildren get reaped instead of piling up as host zombies (Node as
    # PID 1 doesn't reap). NOTE: this is the local/dev compose (build: .,
    # bind mounts, port 3001). Prod runs a SEPARATE hand-maintained compose at
    # /opt/arcaid (prebuilt image, named volumes, behind Caddy) that the deploy
    # never touches — add `init: true` + the healthcheck there directly.
    init: true
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    env_file:
      - .env
    environment:
      # Optional: You can still use a .env file locally with compose
      - NODE_ENV=production
    # Dependency-light health check: Node is already in the Playwright Ubuntu image,
    # so we avoid relying on curl/wget being present. Hits the app's /api/status endpoint.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/status', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
